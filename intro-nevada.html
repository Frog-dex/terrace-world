<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="author" content="Codex">
  <title>TOGA · School approach</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #252b27; color: #efeee7; }
    * { box-sizing: border-box; }
    body { margin: 0; height: 100vh; height: 100dvh; overflow: hidden; }
    main { position: absolute; inset: 0; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; }
    #fireworks { position: absolute; inset: 0; pointer-events: none; }
    .imagery-credit { position: absolute; right: 14px; bottom: 10px; z-index: 5; margin: 0; max-width: calc(100% - 28px); color: #fff; font: 11px/1.35 Arial, sans-serif; text-align: right; text-shadow: 0 1px 3px #000, 0 1px 5px #000; pointer-events: none; }
    .caption { position: absolute; top: max(18px, env(safe-area-inset-top)); left: max(20px, env(safe-area-inset-left)); margin: 0; padding: 8px 12px; background: #252b27; font-size: 14px; font-weight: 500; }
    .story-caption { position: absolute; bottom: max(104px, calc(env(safe-area-inset-bottom) + 88px)); left: 50%; transform: translateX(-50%); width: min(38em, calc(100% - 48px)); margin: 0; color: #fff; font: 500 clamp(16px, 1.65vw, 24px)/1.45 Georgia, serif; text-align: center; text-shadow: 0 1px 3px #000, 0 2px 7px #000; pointer-events: none; }
    body[data-chrome="hidden"] .story-caption { bottom: max(34px, env(safe-area-inset-bottom)); }
    .story-caption{isolation:isolate;padding:12px 24px}
    .story-caption::before{content:"";position:absolute;inset:-18px -12px;background:radial-gradient(ellipse,rgba(0,0,0,.64) 0%,rgba(0,0,0,.38) 42%,transparent 73%);z-index:-1}
    .message { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); max-width: calc(100% - 40px); margin: 0; padding: 15px 20px; background: #252b27; line-height: 1.5; }
    [hidden] { display: none !important; }
    .controls { position: absolute; bottom: 0; left: 0; right: 0; display: grid; grid-template-columns: auto auto minmax(90px, 1fr) auto auto; align-items: center; gap: 12px; padding: 12px max(20px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left)); background: #252b27ed; }
    button, a { font: inherit; font-size: 14px; color: inherit; }
    button { min-height: 44px; border: 0; border-radius: 3px; background: #414a42; padding: 10px 17px; cursor: pointer; }
    button:hover { background: #566052; }
    button:disabled { cursor: wait; color: #b4b9af; }
    a { padding: 12px 0; text-underline-offset: 4px; }
    a:hover { color: #ffffff; }
    input[type="range"] { width: 100%; min-height: 44px; margin: 0; accent-color: #bfc9b4; cursor: pointer; }
    output { font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; min-width: 68px; }
    :focus-visible { outline: 2px solid #f0efdb; outline-offset: 4px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
    body[data-chrome="hidden"] { grid-template-rows: minmax(0, 1fr); }
    body[data-chrome="hidden"] .controls, body[data-chrome="hidden"] .caption { display: none; }
    body[data-embedded="true"] .caption { top: 20px; left: auto; right: 20px; }
    @media (max-width: 540px) {
      .controls { grid-template-columns: auto auto 1fr auto; gap: 5px 10px; padding: 8px 14px max(8px, env(safe-area-inset-bottom)); }
      .controls input { grid-column: 1 / -1; grid-row: 1; }
      .controls button { padding: 8px 12px; }
      .controls a { justify-self: end; font-size: 13px; }
      output { min-width: 0; text-align: center; }
      .caption { left: 14px; top: max(14px, env(safe-area-inset-top)); }
      body[data-embedded="true"] .caption { top: 55px; right: 14px; font-size: 12px; }
    }
    .controls{left:50%;right:auto;bottom:20px;transform:translateX(-50%);width:min(720px,calc(100% - 32px));background:none;color:#241d14;text-shadow:0 1px 2px #fff6}
    body[data-night="true"] .controls{color:#eee1bf;text-shadow:0 1px 3px #000}
    .controls button{background:none;font-family:Arial,sans-serif}
    .controls button:hover{background:none;color:#000}
    body[data-night="true"] .controls button:hover{color:#fff}
    body[data-embedded="true"] .caption{display:none}
  </style>
</head>
<body>
  <!-- Prepared by: Codex. Original town geometry is immutable; this page only controls its camera. -->
  <main id="viewport" aria-label="TOGA town and school cinematic">
    <canvas id="town" role="img" aria-label="Original TOGA town, approaching the school roof"></canvas>
    <canvas id="fireworks" aria-hidden="true"></canvas>
    <p class="caption" id="caption">Nevada · Regional approach</p>
    <p class="story-caption" id="story-caption" hidden>A totally ordinary school.</p>
    <p class="imagery-credit">Imagery © Esri, Vantor, Earthstar Geographics, GIS User Community · USGS</p>
    <p class="message" id="status" role="status">Loading the original town…</p>
    <noscript><p class="message">JavaScript is needed for this camera sequence. <a href="assets/intro-nevada-v1/school-source/references/toga-original.jpeg">View the original town drawing</a>.</p></noscript>
  </main>
  <nav class="controls" aria-label="Camera playback">
    <button id="play" type="button" disabled>Play</button>
    <button id="replay" type="button" disabled>Replay</button>
    <label class="sr-only" for="timeline">Camera time in seconds</label>
    <input id="timeline" type="range" min="0" max="35.4" step="0.01" value="0" disabled>
    <output id="clock" for="timeline">0.0 / 35.4s</output>
    <a hidden>Explore school</a>
  </nav>

  <script src="assets/intro-nevada-v1/school-source/toga-terrain.js"></script>
  <script src="assets/intro-nevada-v1/school-source/toga-civilian.js"></script>
  <script src="assets/intro-nevada-v1/school-source/toga-world.js"></script>
  <script src="assets/intro-nevada-v1/school-source/toga-assets.js"></script>

</body>
</html>
