<!doctype html>
<!-- Prepared by: Codex. This viewer displays page images from Blu Inman's unchanged original PDF. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spirit Striker’s Marketing Map</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { background: #092a5c; color: #fff; font: 16px/1.3 Georgia, 'Times New Roman', serif; }
    .viewer { min-height: 100dvh; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
    header, footer { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 11px clamp(12px, 3vw, 30px); background: #061d40; }
    h1 { margin: 0; font-size: clamp(17px, 2vw, 23px); font-weight: normal; }
    header a { color: #fff; white-space: nowrap; font-size: 14px; text-underline-offset: 3px; }
    main { display: grid; place-items: center; padding: 12px; min-height: 0; }
    main img { display: block; max-width: 100%; max-height: calc(100dvh - 128px); width: auto; height: auto; object-fit: contain; background: #fff; }
    footer { justify-content: center; min-height: 56px; }
    button { min-width: 100px; border: 1px solid #d1b77e; border-radius: 0; padding: 9px 14px; background: #113d77; color: #fff; font: 16px/1 Georgia, 'Times New Roman', serif; cursor: pointer; }
    button:hover, button:focus-visible { background: #1b5aa6; }
    button:disabled { opacity: .4; cursor: default; }
    #count { min-width: 7ch; text-align: center; font-variant-numeric: tabular-nums; }
    @media (max-width: 500px) {
      header { align-items: flex-start; }
      header a { font-size: 13px; }
      main { padding: 8px; }
      main img { max-height: calc(100dvh - 135px); }
      button { min-width: 80px; }
    }
  </style>
</head>
<body>
  <div class="viewer">
    <header><h1>Spirit Striker’s Marketing Map</h1><a href="books/spirit-strikers-marketing-map.pdf">Original PDF</a></header>
    <main><img id="page" src="marketing-map-pages/page-01.jpg" alt="Original Marketing Map, page 1 of 36"></main>
    <footer aria-label="Book pages">
      <button id="previous" type="button" disabled>Previous</button>
      <span id="count" aria-live="polite">1 / 36</span>
      <button id="next" type="button">Next</button>
    </footer>
  </div>
  <script>
    (() => {
      const total = 36;
      const image = document.getElementById('page');
      const count = document.getElementById('count');
      const previous = document.getElementById('previous');
      const next = document.getElementById('next');
      let number = Math.min(total, Math.max(1, Number(location.hash.replace('#page-', '')) || 1));
      function show(page) {
        number = Math.min(total, Math.max(1, page));
        image.src = `marketing-map-pages/page-${String(number).padStart(2, '0')}.jpg`;
        image.alt = `Original Marketing Map, page ${number} of ${total}`;
        count.textContent = `${number} / ${total}`;
        previous.disabled = number === 1;
        next.disabled = number === total;
        history.replaceState(null, '', `#page-${number}`);
        if (number < total) {
          const preload = new Image();
          preload.src = `marketing-map-pages/page-${String(number + 1).padStart(2, '0')}.jpg`;
        }
      }
      previous.addEventListener('click', () => show(number - 1));
      next.addEventListener('click', () => show(number + 1));
      document.addEventListener('keydown', event => {
        if (event.key === 'ArrowRight') show(number + 1);
        if (event.key === 'ArrowLeft') show(number - 1);
      });
      let startX = null;
      image.addEventListener('touchstart', event => { startX = event.touches[0].clientX; }, {passive: true});
      image.addEventListener('touchend', event => {
        if (startX === null) return;
        const distance = event.changedTouches[0].clientX - startX;
        if (Math.abs(distance) > 55) show(number + (distance < 0 ? 1 : -1));
        startX = null;
      }, {passive: true});
      show(number);
    })();
  </script>
</body>
</html>
