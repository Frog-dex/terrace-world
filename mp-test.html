<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Terrace World · Multiplayer Test</title>
<style>
  :root{--bg:#1b2230;--card:#252e40;--ink:#f3efe4;--dim:#9aa6bd;--gold:#f2c14e;--green:#6fcf7f;--red:#ef6b5b}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#2c3a55,var(--bg) 70%);color:var(--ink);
       font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:flex;justify-content:center;padding:16px}
  main{width:100%;max-width:520px}
  h1{font-size:22px;margin:8px 0 4px}
  .sub{color:var(--dim);margin:0 0 16px;font-size:14px}
  .card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:12px}
  button{font:inherit;border:0;border-radius:12px;cursor:pointer}
  .btn{background:#3a4660;color:var(--ink);padding:10px 14px}
  .big{display:block;width:100%;padding:28px 16px;font-size:28px;font-weight:700;background:var(--gold);color:#2a2112;
       box-shadow:0 6px 0 #b98d2c;transition:transform .05s}
  .big:active{transform:translateY(4px);box-shadow:0 2px 0 #b98d2c}
  .big:disabled{opacity:.4;cursor:default}
  .count{font-size:56px;font-weight:800;text-align:center;margin:8px 0 0}
  .last{text-align:center;color:var(--dim);min-height:1.4em}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  input{font:inherit;background:#1b2230;color:var(--ink);border:1px solid #3a4660;border-radius:10px;padding:10px;flex:1;min-width:0}
  .code{font:700 20px ui-monospace,Menlo,monospace;letter-spacing:2px;color:var(--gold)}
  ul{list-style:none;padding:0;margin:8px 0 0}
  li{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid #313b52}
  li:first-child{border-top:0}
  .dot{width:12px;height:12px;border-radius:50%}
  .status{font-size:14px}
  .ok{color:var(--green)} .bad{color:var(--red)}
  .log{font:12px ui-monospace,Menlo,monospace;color:var(--dim);max-height:140px;overflow:auto;white-space:pre-wrap}
  .flash{animation:flash .5s}
  @keyframes flash{from{background:#4d5f86}to{background:var(--card)}}
  [hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1>Terrace World · Multiplayer Test</h1>
  <p class="sub">One device hosts, the others join. Press the button and every device should see it.</p>

  <section class="card">
    <div class="row">
      <label for="name" style="color:var(--dim)">Your name</label>
      <input id="name" maxlength="16" placeholder="Dreamer Frog">
    </div>
    <p class="status" id="status">Not connected.</p>
    <div id="lobby" class="row">
      <button class="btn" id="hostBtn">Host a game</button>
      <input id="joinCode" placeholder="Room code" maxlength="6" style="text-transform:uppercase">
      <button class="btn" id="joinBtn">Join</button>
    </div>
    <div id="share" hidden>
      <p style="margin:12px 0 4px">Room <span class="code" id="codeOut"></span></p>
      <div class="row">
        <input id="linkOut" readonly>
        <button class="btn" id="copyBtn">Copy link</button>
      </div>
    </div>
  </section>

  <section class="card" id="game">
    <button class="big" id="press" disabled>It works!</button>
    <p class="count" id="count">0</p>
    <p class="last" id="last"></p>
  </section>

  <section class="card">
    <strong>Players</strong> <span id="ping" style="color:var(--dim);font-size:13px"></span>
    <ul id="players"></ul>
  </section>

  <section class="card">
    <strong>Log</strong>
    <div class="log" id="log"></div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(() => {
  const PREFIX = 'terrace-world-mp-';
  const COLORS = ['#f2c14e','#6fcf7f','#7fb6ff','#ef6b5b','#c58cf2','#5fd6d0','#ff9d5c','#e8e8e8'];
  const $ = id => document.getElementById(id);
  const log = m => { const el=$('log'); el.textContent = `${new Date().toLocaleTimeString()}  ${m}\n` + el.textContent; };
  const setStatus = (m, cls='') => { $('status').textContent = m; $('status').className = 'status ' + cls; };
  const myName = () => ($('name').value.trim() || 'Player').slice(0,16);
  const newCode = () => Array.from({length:6},()=> 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*31)]).join('');

  try { $('name').value = localStorage.getItem('mpName') || ''; } catch(e) {}
  $('name').addEventListener('change', () => {
    try { localStorage.setItem('mpName', myName()); } catch(e) {}
    if (isHost) { state.players[peer.id].name = myName(); broadcast(); render(); }
    else if (hostConn && hostConn.open) hostConn.send({t:'hello', name: myName()});
  });

  if (typeof Peer === 'undefined') {
    setStatus('Could not load the networking library (PeerJS). Check the internet connection.', 'bad');
    return;
  }

  let peer = null, isHost = false, hostConn = null;
  const conns = new Map();                       // host side: peerId -> DataConnection
  let state = { count: 0, last: null, players: {} };

  function render() {
    $('count').textContent = state.count;
    $('last').textContent = state.last ? `${state.last} pressed it` : '';
    const ul = $('players'); ul.innerHTML = '';
    Object.entries(state.players).forEach(([id,p]) => {
      const li = document.createElement('li');
      li.innerHTML = `<span class="dot" style="background:${p.color}"></span><span></span>`;
      li.lastChild.textContent = p.name + (p.host ? ' (host)' : '') + (peer && id === peer.id ? ' · you' : '');
      ul.appendChild(li);
    });
  }
  function flash() { const g=$('game'); g.classList.remove('flash'); void g.offsetWidth; g.classList.add('flash'); }
  function ready(msg) { $('press').disabled = false; $('lobby').hidden = true; setStatus(msg, 'ok'); }

  // ---------- HOST ----------
  function broadcast() { for (const c of conns.values()) if (c.open) c.send({t:'state', state}); }
  function hostPress(name) { state.count++; state.last = name; broadcast(); render(); flash(); }

  function host() {
    const code = newCode();
    setStatus('Creating room…');
    peer = new Peer(PREFIX + code, { debug: 1 });
    peer.on('open', id => {
      isHost = true;
      state.players[id] = { name: myName(), color: COLORS[0], host: true };
      $('codeOut').textContent = code;
      const link = location.href.split('?')[0].split('#')[0] + '?room=' + code;
      $('linkOut').value = link; $('share').hidden = false;
      ready('Hosting. Open the link on another device (or another tab) to join.');
      log('room ' + code + ' is open');
      render();
    });
    peer.on('connection', c => {
      c.on('open', () => {
        conns.set(c.peer, c);
        const color = COLORS[Object.keys(state.players).length % COLORS.length];
        state.players[c.peer] = { name: 'Joining…', color };
        log('a device connected'); broadcast(); render();
      });
      c.on('data', d => {
        if (!d || typeof d !== 'object') return;
        if (d.t === 'hello' && state.players[c.peer]) {
          state.players[c.peer].name = String(d.name || 'Player').slice(0,16);
          log(state.players[c.peer].name + ' joined'); broadcast(); render();
        } else if (d.t === 'press') {
          hostPress(state.players[c.peer] ? state.players[c.peer].name : 'Someone');
        } else if (d.t === 'ping') {
          c.send({t:'pong', ts: d.ts});
        }
      });
      c.on('close', () => {
        const p = state.players[c.peer];
        conns.delete(c.peer); delete state.players[c.peer];
        log((p ? p.name : 'A player') + ' left'); broadcast(); render();
      });
    });
    peer.on('error', e => {
      if (e.type === 'unavailable-id') { log('code clash, retrying'); peer.destroy(); host(); return; }
      setStatus('Error: ' + e.type, 'bad'); log('error ' + e.type);
    });
  }

  // ---------- CLIENT ----------
  function join(code) {
    code = code.trim().toUpperCase();
    if (!code) return;
    setStatus('Joining room ' + code + '…');
    peer = new Peer({ debug: 1 });
    peer.on('open', () => {
      hostConn = peer.connect(PREFIX + code, { reliable: true });
      hostConn.on('open', () => {
        hostConn.send({t:'hello', name: myName()});
        $('codeOut').textContent = code; $('linkOut').value = location.href; $('share').hidden = false;
        ready('Connected to room ' + code + '.');
        log('joined room ' + code);
        setInterval(() => { if (hostConn.open) hostConn.send({t:'ping', ts: performance.now()}); }, 2000);
      });
      hostConn.on('data', d => {
        if (d && d.t === 'state') {
          const bumped = d.state.count !== state.count;
          state = d.state; render(); if (bumped) flash();
        } else if (d && d.t === 'pong') {
          $('ping').textContent = '· ping ' + Math.round(performance.now() - d.ts) + ' ms';
        }
      });
      hostConn.on('close', () => { setStatus('The host left. Room closed.', 'bad'); $('press').disabled = true; log('host left'); });
    });
    peer.on('error', e => {
      const msg = e.type === 'peer-unavailable' ? 'No room with that code. Check it, or ask the host to open one.' : 'Error: ' + e.type;
      setStatus(msg, 'bad'); log('error ' + e.type);
      $('lobby').hidden = false;
    });
  }

  $('hostBtn').onclick = host;
  $('joinBtn').onclick = () => join($('joinCode').value);
  $('press').onclick = () => {
    if (isHost) hostPress(myName());
    else if (hostConn && hostConn.open) hostConn.send({t:'press'});
  };
  $('copyBtn').onclick = async () => {
    try { await navigator.clipboard.writeText($('linkOut').value); $('copyBtn').textContent = 'Copied'; }
    catch(e) { $('linkOut').select(); }
  };

  const room = new URLSearchParams(location.search).get('room');
  if (room) { $('joinCode').value = room; join(room); }
  render();
})();
</script>
</body>
</html>
