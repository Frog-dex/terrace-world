<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Terrace World · Multiplayer Test</title>
<style>
  :root{--bg:#1b2230;--card:#252e40;--ink:#f3efe4;--dim:#9aa6bd;--gold:#f2c14e;--green:#6fcf7f;--red:#ef6b5b}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#2c3a55,var(--bg) 70%);color:var(--ink);
       font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:flex;justify-content:center;padding:16px}
  main{width:100%;max-width:520px}
  h1{font-size:22px;margin:8px 0 4px}
  .sub{color:var(--dim);margin:0 0 16px;font-size:14px}
  .card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:12px}
  button{font:inherit;border:0;border-radius:12px;cursor:pointer}
  .btn{background:#3a4660;color:var(--ink);padding:10px 14px}
  .big{display:block;width:100%;padding:28px 16px;font-size:28px;font-weight:700;background:var(--gold);color:#2a2112;
       box-shadow:0 6px 0 #b98d2c;transition:transform .05s}
  .big:active{transform:translateY(4px);box-shadow:0 2px 0 #b98d2c}
  .big:disabled{opacity:.4;cursor:default}
  .count{font-size:56px;font-weight:800;text-align:center;margin:8px 0 0}
  .last{text-align:center;color:var(--dim);min-height:1.4em}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  input{font:inherit;background:#1b2230;color:var(--ink);border:1px solid #3a4660;border-radius:10px;padding:10px;flex:1;min-width:0}
  ul{list-style:none;padding:0;margin:8px 0 0}
  li{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid #313b52}
  li:first-child{border-top:0}
  .dot{width:12px;height:12px;border-radius:50%}
  .status{font-size:14px}
  .ok{color:var(--green)} .bad{color:var(--red)}
  .log{font:12px ui-monospace,Menlo,monospace;color:var(--dim);max-height:140px;overflow:auto;white-space:pre-wrap}
  .flash{animation:flash .5s}
  @keyframes flash{from{background:#4d5f86}to{background:var(--card)}}
</style>
</head>
<body>
<main>
  <h1>Terrace World · Multiplayer Test</h1>
  <p class="sub">Everyone who opens this link is in the same room. Press the button and every device should see it.</p>

  <section class="card">
    <div class="row">
      <label for="name" style="color:var(--dim)">Your name</label>
      <input id="name" maxlength="16" placeholder="Dreamer Frog">
    </div>
    <p class="status" id="status">Connecting…</p>
    <div class="row">
      <input id="linkOut" readonly>
      <button class="btn" id="copyBtn">Copy link</button>
    </div>
  </section>

  <section class="card" id="game">
    <button class="big" id="press">It works!</button>
    <p class="count" id="count">0</p>
    <p class="last" id="last"></p>
  </section>

  <section class="card">
    <strong>Players</strong>
    <ul id="players"></ul>
  </section>

  <section class="card">
    <strong>Log</strong>
    <div class="log" id="log"></div>
  </section>
</main>

<script type="module">
  import {joinRoom, selfId} from 'https://cdn.jsdelivr.net/npm/trystero@0.25.4/+esm';
  window.__mpLoaded = true;

  const APP_ID = 'frog-dex-terrace-world';
  const ROOM = 'lobby';
  const COLORS = ['#f2c14e','#6fcf7f','#7fb6ff','#ef6b5b','#c58cf2','#5fd6d0','#ff9d5c','#e8e8e8'];
  const $ = id => document.getElementById(id);
  const log = m => { const el=$('log'); el.textContent = `${new Date().toLocaleTimeString()}  ${m}\n` + el.textContent; };
  const setStatus = (m, cls='') => { $('status').textContent = m; $('status').className = 'status ' + cls; };
  const myName = () => ($('name').value.trim() || 'Player').slice(0,16);
  const colorFor = id => COLORS[[...id].reduce((h,c) => (h*31 + c.charCodeAt(0)) >>> 0, 7) % COLORS.length];

  try { $('name').value = localStorage.getItem('mpName') || ''; } catch(e) {}
  $('linkOut').value = location.href.split('?')[0].split('#')[0];

  let count = 0, last = '';
  const names = {};                                  // peerId -> name, for everyone else in the room

  function render() {
    $('count').textContent = count;
    $('last').textContent = last ? `${last} pressed it` : '';
    const ul = $('players'); ul.innerHTML = '';
    const rows = [[selfId, myName() + ' · you'], ...Object.entries(names)];
    rows.forEach(([id, label]) => {
      const li = document.createElement('li');
      li.innerHTML = '<span class="dot"></span><span></span>';
      li.firstChild.style.background = colorFor(id);
      li.lastChild.textContent = label;
      ul.appendChild(li);
    });
    const others = Object.keys(names).length;
    if (others) setStatus(`Connected · ${others + 1} players here.`, 'ok');
    else setStatus('You\'re in. Waiting for others: send them this link.', 'ok');
  }
  function flash() { const g=$('game'); g.classList.remove('flash'); void g.offsetWidth; g.classList.add('flash'); }

  const room = joinRoom({appId: APP_ID}, ROOM, {
    onJoinError: d => { setStatus('Could not join the room. Reload to try again.', 'bad'); log('join error ' + JSON.stringify(d)); }
  });
  const hello = room.makeAction('hello');
  const press = room.makeAction('press');

  room.onPeerJoin = peerId => {
    if (!names[peerId]) names[peerId] = 'Joining…';
    hello.send({name: myName(), count}, {target: peerId});
    render();
  };
  room.onPeerLeave = peerId => {
    log((names[peerId] || 'A player') + ' left');
    delete names[peerId];
    render();
  };
  hello.onMessage = (data, {peerId}) => {
    if (!data || typeof data !== 'object') return;
    const isNew = !names[peerId] || names[peerId] === 'Joining…';
    names[peerId] = String(data.name || 'Player').slice(0,16);
    if (Number.isFinite(data.count) && data.count > count) count = data.count;
    if (isNew) log(names[peerId] + ' joined');
    render();
  };
  press.onMessage = (data, {peerId}) => {
    count++; last = names[peerId] || 'Someone';
    render(); flash();
  };

  $('press').onclick = () => {
    count++; last = myName();
    press.send({});
    render(); flash();
  };
  $('name').addEventListener('change', () => {
    try { localStorage.setItem('mpName', myName()); } catch(e) {}
    hello.send({name: myName(), count});
    render();
  });
  $('copyBtn').onclick = async () => {
    try { await navigator.clipboard.writeText($('linkOut').value); $('copyBtn').textContent = 'Copied'; }
    catch(e) { $('linkOut').select(); }
  };

  log('joined the room');
  render();
</script>
<script>
  setTimeout(() => {
    if (!window.__mpLoaded) {
      const s = document.getElementById('status');
      s.textContent = 'Could not load the networking library. Check the internet connection.';
      s.className = 'status bad';
    }
  }, 8000);
</script>
</body>
</html>
