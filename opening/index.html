  // the chined fuselage: a lens in section, sharp at the chine, flat underneath
  const ST = [[9.2,0,0,0],[8.5,.15,.11,.07],[7.4,.38,.25,.16],[6.2,.6,.37,.24],[4.7,.8,.47,.31],[3.1,.96,.54,.35],[1.0,1.06,.57,.36],[-1.6,1.06,.55,.35],[-4.0,.97,.5,.32],[-6.0,.8,.42,.27],[-7.3,.56,.33,.2],[-8.0,.34,.22,.13]];
  const M = 16, up = [], dn = [];
  for (const [x, wc, hu, hd] of ST){
    const U = [], D = [];
    for (let j = 0; j <= M; j++){ const z = wc*(1 - 2*j/M); U.push([z, hu*(1 - Math.pow(Math.abs(z/(wc || 1)), 1.8))]); }
    for (let j = 0; j <= M; j++){ const z = -wc*(1 - 2*j/M); D.push([z, -hd*(1 - Math.pow(Math.abs(z/(wc || 1)), 2.4))]); }
    up.push({ x, pts:U }); dn.push({ x, pts:D }); }
  add(loftStrip(up), body); add(loftStrip(dn), belly);
  add(capFan(up.at(-1), true), dark, { edges:false }); add(capFan(dn.at(-1), true), dark, { edges:false });
  // the canopy
  { const g = new THREE.SphereGeometry(1, 28, 16); g.scale(0.95, 0.28, 0.34); add(g, glass, { x:5.55, y:0.36 }); }
  // the delta wing, one side at a time
  for (const side of [1, -1]){
    let P = [[2.8, .7], [-5.1, 4.5], [-6.1, 4.62], [-6.7, 4.5], [-7.3, 1.9], [-7.6, .7]].map(([x, z]) => new THREE.Vector2(x, z*side));
    if (side < 0) P = P.reverse();
    const g = new THREE.ExtrudeGeometry(new THREE.Shape(P), { depth:0.13, bevelEnabled:true, bevelThickness:0.03, bevelSize:0.05, bevelSegments:1 }); g.rotateX(Math.PI/2); g.translate(0, 0.05, 0);
    add(g, body);
    // the nacelle: a long lathe with an intake lip and a nozzle
    const prof = [[.44, 2.25], [.55, 1.7], [.64, .4], [.67, -1.5], [.66, -4.0], [.61, -6.0], [.55, -7.4], [.5, -8.1], [.41, -8.12]].map(([r, h]) => new THREE.Vector2(r, h));
    const ng = new THREE.LatheGeometry(prof, 28); ng.rotateZ(-Math.PI/2);
    add(ng, body, { y:0.02, z:2.78*side });
    const spike = new THREE.ConeGeometry(0.37, 1.5, 24); spike.rotateZ(-Math.PI/2); add(spike, toon('#4a525d'), { x:2.95, y:0.02, z:2.78*side });
    const intake = new THREE.CircleGeometry(0.44, 24); intake.rotateY(Math.PI/2); part(jet, intake, dark, { x:2.2, y:0.02, z:2.78*side, ink:0 });
    const nozzle = new THREE.CircleGeometry(0.42, 24); nozzle.rotateY(-Math.PI/2); part(jet, nozzle, toon('#111318'), { x:-8.08, y:0.02, z:2.78*side, ink:0 });
    // the fin, canted in over the nacelle
    const fin = new THREE.ExtrudeGeometry(new THREE.Shape([[-4.3, 0], [-7.7, 0], [-7.95, 2.15], [-6.55, 2.15]].map(([x, y]) => new THREE.Vector2(x, y))), { depth:0.07, bevelEnabled:false }); fin.translate(0, 0, -0.035);
    const f = add(fin, body, { y:0.55, z:2.78*side, rx:-0.26*side });
    // nav lights at the wing tips
    const nav = new THREE.Mesh(new THREE.SphereGeometry(0.07, 8, 6), new THREE.MeshBasicMaterial({ color: side > 0 ? '#63e08a' : '#ff5a4a' })); nav.position.set(-6.1, 0.08, 4.62*side); jet.add(nav);
  }
  // the afterburners: a hot cone and shock diamonds behind each nozzle
  const burnOuter = new THREE.MeshBasicMaterial({ color:'#ff8a3a', transparent:true, opacity:0.75, depthWrite:false, blending:THREE.AdditiveBlending });
  const burnInner = new THREE.MeshBasicMaterial({ color:'#ffe7a8', transparent:true, opacity:0.95, depthWrite:false, blending:THREE.AdditiveBlending });
  jet.userData.burners = [];
  for (const side of [1, -1]){ const b = new THREE.Group(); b.position.set(-8.1, 0.02, 2.78*side); jet.add(b);
    const o = new THREE.ConeGeometry(0.4, 3.4, 16, 1, true); o.rotateZ(Math.PI/2); o.translate(-1.7, 0, 0); b.add(new THREE.Mesh(o, burnOuter));
    const i = new THREE.ConeGeometry(0.24, 1.8, 12, 1, true); i.rotateZ(Math.PI/2); i.translate(-0.9, 0, 0); b.add(new THREE.Mesh(i, burnInner));
    for (let k = 0; k < 4; k++){ const d = new THREE.Mesh(new THREE.SphereGeometry(0.16 - k*0.025, 10, 6), burnInner); d.position.x = -0.7 - k*0.62; d.scale.set(0.6, 1, 1); b.add(d); }
    jet.userData.burners.push(b); }
  const beacon = new THREE.Mesh(new THREE.SphereGeometry(0.09, 8, 6), new THREE.MeshBasicMaterial({ color:'#ff4a3a' })); beacon.position.set(-2.0, -0.4, 0); jet.add(beacon); jet.userData.beacon = beacon;
  jet.traverse(o => { if (o.isMesh && o.material !== burnOuter && o.material !== burnInner) o.castShadow = true; });
  return jet;
}

  part(r, new THREE.CylinderGeometry(0.034, 0.034, 0.24, 14), toon(color), { y:0.12, ink:0.008 });

function makeCrate(){

  for (let i = 0; i < 8; i++){ const row = i >> 2, col = i % 4, rk = makeRocket(ROCKET_COLS[i]);

/* ---------- fireworks: every spark is a closed-form path (drag and gravity), so any moment can be drawn directly ---------- */
const FW_MAX = 12, FW_N = 230, FW_TRAIL = 5, RK_N = 50;
const fwU = { uT:{ value: 0 }, uPx:{ value: 1 }, uO:{ value: Array.from({ length: FW_MAX }, () => new THREE.Vector3()) }, uB:{ value: new Array(FW_MAX).fill(-99) },
  uC1:{ value: Array.from({ length: FW_MAX }, () => new THREE.Color()) }, uC2:{ value: Array.from({ length: FW_MAX }, () => new THREE.Color()) }, uV:{ value: new Array(FW_MAX).fill(20) },
  uR0:{ value: Array.from({ length: FW_MAX }, () => new THREE.Vector3()) }, uL:{ value: new Array(FW_MAX).fill(-99) } };
function makeFireworks(){
  const N = FW_MAX*(FW_N*FW_TRAIL + RK_N), bi = new Float32Array(N), dir = new Float32Array(N*3), rnd = new Float32Array(N*2), kind = new Float32Array(N), r = mulberry32(1983);
  let k = 0;
  for (let b = 0; b < FW_MAX; b++){
    for (let j = 0; j < FW_N; j++){ const y = 1 - 2*(j + 0.5)/FW_N, rr = Math.sqrt(1 - y*y), a = j*2.39996 + r()*0.2, d = [Math.cos(a)*rr, y, Math.sin(a)*rr], s = 0.82 + r()*0.3, ph = r();
      for (let t = 0; t < FW_TRAIL; t++){ bi[k] = b; dir.set(d, k*3); rnd[k*2] = s; rnd[k*2 + 1] = ph; kind[k] = t; k++; } }
    for (let j = 0; j < RK_N; j++){ bi[k] = b; dir.set([(r() - 0.5), r()*0.4, (r() - 0.5)], k*3); rnd[k*2] = j/RK_N; rnd[k*2 + 1] = r(); kind[k] = -1; k++; } }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(N*3), 3));
  g.setAttribute('bi', new THREE.BufferAttribute(bi, 1)); g.setAttribute('dir', new THREE.BufferAttribute(dir, 3)); g.setAttribute('rnd', new THREE.BufferAttribute(rnd, 2)); g.setAttribute('kind', new THREE.BufferAttribute(kind, 1));
  const m = new THREE.ShaderMaterial({ uniforms: fwU, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
    vertexShader:`
      #define FW_MAX ${FW_MAX}
      uniform float uT, uPx; uniform vec3 uO[FW_MAX], uR0[FW_MAX]; uniform float uB[FW_MAX], uV[FW_MAX], uL[FW_MAX]; uniform vec3 uC1[FW_MAX], uC2[FW_MAX];
      attribute float bi, kind; attribute vec3 dir; attribute vec2 rnd; varying vec3 vC; varying float vA;
      const float K = 1.5, G = 6.0, LIFE = 3.1;
      vec3 spark(vec3 o, vec3 d, float v, float a){ float e = (1.0 - exp(-K*a))/K; return o + d*v*e - vec3(0.0, G*(a/K - e/K), 0.0); }
      void main(){
        int b = int(bi + 0.5); vec3 o = uO[b]; float tb = uB[b], tl = uL[b], v = uV[b];
        vec3 p = vec3(0.0); float a = 0.0, size = 0.0; vA = 0.0; vC = vec3(1.0);
        if (kind < -0.5){                                   // the rocket's climb: sparks shed along its path
          float fly = tb - tl, te = tl + rnd.x*fly, age = uT - te;
          if (age > 0.0 && age < 0.7 && uT < tb + 0.05){ float u = (te - tl)/fly; vec3 q = mix(uR0[b], o, u*u);
            p = q + dir*age*1.6 - vec3(0.0, 2.5*age*age, 0.0); vA = (1.0 - age/0.7)*0.9; size = 2.2*(1.0 - age/0.7) + 1.0; vC = vec3(1.0, 0.8, 0.45); }
          if (uT > tl && uT < tb && rnd.x < 0.03){ float u = (uT - tl)/fly; p = mix(uR0[b], o, u*u); vA = 1.0; size = 5.0; vC = vec3(1.0, 0.95, 0.8); }
        } else {
          a = uT - tb - kind*0.05;
          if (a > 0.0 && a < LIFE){ float s = rnd.x; p = spark(o, dir, v*s, a);
            float f = 1.0 - a/LIFE; vA = f*f*(1.0 - kind*0.18);
            float crackle = step(0.55, fract(sin((a*9.0 + rnd.y*40.0))*43758.5))*step(1.3, a); vA *= mix(1.0, 1.6*crackle, step(1.3, a));
            vC = mix(uC1[b], uC2[b], smoothstep(0.4, 1.7, a + rnd.y*0.4))*1.35; if (a < 0.1) { vC = vec3(1.0); vA = 1.0; }
            size = (5.2 - kind*0.8)*(0.55 + 0.45*f); }
        }
        vec4 mv = modelViewMatrix*vec4(p, 1.0); gl_Position = projectionMatrix*mv;
        gl_PointSize = size*uPx*clamp(230.0/max(-mv.z, 1.0), 0.8, 4.0);
        if (vA <= 0.0) gl_PointSize = 0.0;
      }`,
    fragmentShader:`varying vec3 vC; varying float vA; void main(){ float r = length(gl_PointCoord - 0.5); float a = smoothstep(0.5, 0.0, r); gl_FragColor = vec4(vC*a*vA + vec3(1.0)*smoothstep(0.18, 0.0, r)*vA*0.6, 1.0); }` });
  const pts = new THREE.Points(g, m); pts.frustumCulled = false; pts.renderOrder = 5; return pts;
}

/* ======================= the ending: caught on the roof =======================
   The kid's fireworks bring school security up through the stair tower's roof door. A flashlight finds him; he grabs his last
   rocket and runs: down onto the hipped hall roof, across it, a drop to the low wing, out to its edge. A beat at the edge,
   something in the sky, the fuse lit. He jumps, the rocket goes up, the picture closes to black around him, and then the crash. */

/* ---------- a jointed figure (faces +x): hips, shoulders and head turn; the kid and the guard share it ---------- */
function makeFigure({ s = 1, skin = '#e2b48c', shirt = '#c8483c', stripe = '#eeeae0', pants = '#3e5f8e', shoe = '#e9e6de', hair = '#3a281e', cap = null, guard = false }){
  const root = new THREE.Group(), hips = new THREE.Group(); hips.position.y = 0.74*s; root.add(hips);
  const M = c => toon(c), cyl = (r0, r1, h, seg = 14) => new THREE.CylinderGeometry(r0*s, r1*s, h*s, seg), ink = 0.012*s;
  const legs = [];
  for (const k of [1, -1]){ const leg = new THREE.Group(); leg.position.z = 0.08*k*s; hips.add(leg);
    part(leg, cyl(guard ? 0.078 : 0.072, guard ? 0.066 : 0.062, 0.66), M(pants), { y: -0.35*s, ink });
    part(leg, new THREE.BoxGeometry(0.24*s, 0.085*s, 0.1*s), M(shoe), { x: 0.035*s, y: -0.7*s, ink }); legs.push(leg); }
  const torso = new THREE.Group(); hips.add(torso);
  part(torso, new THREE.BoxGeometry(0.19*s, 0.15*s, 0.3*s), M(pants), { y: 0.0, ink });
  part(torso, cyl(0.155, 0.145, 0.43, 18), M(shirt), { y: 0.25*s, ink });
  if (!guard){ part(torso, cyl(0.152, 0.146, 0.05, 18), M(stripe), { y: 0.29*s, ink: 0 }); part(torso, cyl(0.151, 0.143, 0.035, 18), M(stripe), { y: 0.19*s, ink: 0 }); }
  else { part(torso, cyl(0.158, 0.158, 0.05, 18), M('#1c2230'), { y: 0.05*s, ink: 0 });                      // belt
    part(torso, new THREE.BoxGeometry(0.02*s, 0.06*s, 0.05*s), M('#d8b348'), { x: 0.15*s, y: 0.36*s, z: -0.07*s, ink: 0 }); }   // badge
  part(torso, cyl(0.05, 0.05, 0.08), M(skin), { y: 0.49*s, ink: 0.01*s });
  const head = new THREE.Group(); head.position.y = 0.51*s; torso.add(head);
  part(head, new THREE.SphereGeometry(0.115*s, 20, 14), M(skin), { y: 0.11*s, ink });

  // the school wagon
  { const p = wagonPose(tau); cast.wagon.position.set(X(p.x), HEIGHT(p.x, p.y) + 0.02, Z(p.y)); cast.wagon.rotation.y = -p.heading; }
  // the kid: looks up, points at the bursts; the door; he grabs the last rocket and runs, hops, drops, the edge, the jump
  { const K = cast.kid, kp = KP; K.position.set(X(kp.x), HEIGHT(kp.x, kp.y) + kp.z, Z(kp.y));
    let heading = Math.PI/2, P = {};
    const up = 0.55*smooth(28.6, 30.6, tau)*(1 - smooth(END.door, END.door + 0.4, tau)), point = smooth(32.1, 32.8, tau)*(1 - smooth(34.2, 35.0, tau));
    if (kp.k === 'stand'){ const turn = smooth(36.15, 36.55, tau), startle = smooth(END.door, END.door + 0.15, tau)*(1 - smooth(36.2, 36.5, tau));

      P = { headZ: up + 0.04*Math.sin(tau*0.9), headY: 1.2*smooth(35.62, 35.9, tau)*(1 - turn), armR: 2.55*point + 0.9*smooth(36.2, 36.45, tau), armRx: -0.25*point, crouch: 0.25*startle }; }
    else if (kp.k === 'run'){ heading = kp.heading; P = { run: 1, ph: tau*14.5, lean: 0.28, bob: Math.abs(Math.sin(tau*14.5))*0.05 }; }
    else if (kp.k === 'jump'){ heading = kp.heading; P = { legs: [0.95, -0.35], armR: 2.2, armL: 1.9, lean: 0.15 }; }
    else if (kp.k === 'land'){ heading = -0.33; P = { crouch: 1 - kp.u*0.8, armR: 0.6, armL: 0.6 }; }
    else if (kp.k === 'edge'){ heading = -0.12;
      const wob = 1 - smooth(42.55, 43.4, tau), down = smooth(43.0, 43.4, tau)*(1 - smooth(43.8, 44.1, tau)), back = smooth(43.9, 44.2, tau)*(1 - smooth(44.5, 44.8, tau));
      const raise = smooth(44.45, 44.85, tau), crouch = smooth(44.85, 45.2, tau);
      P = { armRx: -1.25*(1 - raise) + Math.sin(tau*9)*0.35*wob, armLx: 1.25 + Math.sin(tau*9 + 1)*0.35*wob, armR: 2.9*raise, headZ: -0.55*down, headY: 1.2*back, crouch: 0.55*crouch, lean: 0.05 }; }
    else if (kp.k === 'fall'){ heading = -0.12; P = { legs: [0.7, -0.55], armR: 2.9, armL: 2.3, lean: -0.15 }; }
    K.rotation.y = -heading; poseFigure(K, P); K.updateMatrixWorld(true); }
  // security: out of the door, a sweep of the light, then after him to the tower's edge
  { const gp = routePose(GUARD_ROUTE, tau), G = cast.guard, kp = KP; G.visible = gp.k !== 'hide' && tau < END.irisB + 0.3;
    G.position.set(X(gp.x), HEIGHT(gp.x, gp.y) + STAIR_ROOF, Z(gp.y));
    const toKid = Math.atan2(kp.y - gp.y, kp.x - gp.x); let h = gp.heading ?? toKid;
    if (gp.k === 'stand' && tau < 36.75) h = lerp(Math.PI/2 + 0.9, toKid, smooth(36.0, 36.4, tau));
    G.rotation.y = -h;
    const wave = smooth(39.2, 39.5, tau)*(1 - smooth(41.4, 41.8, tau));
    poseFigure(G, gp.k === 'walk' ? { run: 0.45, ph: tau*8, armR: 1.35 } : gp.k === 'run' ? { run: 0.75, ph: tau*11, lean: 0.12, armR: 1.35 } : { armR: 1.45, armL: 2.7*wave + 0.25*wave*Math.sin(tau*13) });
    G.updateMatrixWorld(true);
    const on = G.visible ? smooth(35.72, 35.8, tau) : 0, from = G.userData.lamp.getWorldPosition(_v1);
    const kidAt = _v2.set(X(kp.x), HEIGHT(kp.x, kp.y) + kp.z + 0.9, Z(kp.y)), aim = toWorld([470, 345, 6.5]).lerp(toWorld([458, 342, 6.5]), smooth(35.75, 36.1, tau)).lerp(kidAt, smooth(36.05, 36.4, tau));
    world.flashlight.set(from, aim, on); }
  // the roof door bangs open onto the lit stair
  { const B = cast.door.userData, o = smooth(END.door - 0.06, END.door + 0.06, tau), a = Math.max(0, tau - END.door - 0.06), bounce = Math.exp(-a*6)*Math.sin(a*22)*0.14;
    B.hinge.rotation.y = -(1.85 - bounce)*o; B.spill.material.opacity = o*0.85*night; }
  // something in the sky while he stands at the edge
  { const U = cast.ufo, vis = tau > 42.45 && tau < 45.2; U.visible = vis;
    if (vis){ const a = smooth(42.5, 43.1, tau), zip = smooth(44.85, 45.15, tau), drift = smooth(42.5, 44.85, tau);
      const p = toWorld([lerp(447, 440, drift) - zip*90, lerp(284, 292, drift) - zip*60, lerp(33, 36, drift) + zip*120]); p.y -= (1 - a)*8; U.position.copy(p);
      U.rotation.set(Math.sin(tau*1.3)*0.08, tau*1.4, Math.cos(tau*1.1)*0.06); U.scale.setScalar(0.12*(0.3 + 0.7*a)*(1 - zip*0.7));
      U.userData.lights.forEach((m, k) => m.material.color.set(Math.floor(tau*6 + k) % 3 === 0 ? '#ffd86a' : '#8ff0c8')); U.userData.glow.material.opacity = 0.35 + 0.2*Math.sin(tau*5); } }
  // the picture closes around him as he falls
  if (tau >= END.irisA){ const kp = KP, c = _v1.set(X(kp.x), HEIGHT(kp.x, kp.y) + kp.z + 0.8, Z(kp.y)).project(camera), cx = c.x*0.5 + 0.5, cy = c.y*0.5 + 0.5, asp = innerWidth/innerHeight;
    let R0 = 0; for (const [x, y] of [[0, 0], [1, 0], [0, 1], [1, 1]]) R0 = Math.max(R0, Math.hypot((x - cx)*asp, y - cy)); R0 += 0.05;
    const u = smooth(END.irisA, END.irisB - 0.3, tau), R = tau < END.irisB - 0.3 ? lerp(R0, 0.085, 1 - Math.pow(1 - u, 2)) : lerp(0.085, 0, smooth(END.irisB - 0.18, END.irisB, tau));
    postU.uIrisC.value.set(cx, cy); postU.uIris.value = Math.max(0, R); }
  // rockets and fireworks
  { const fw = world.fw.material.uniforms; fw.uT.value = tau; fw.uPx.value = renderer.getPixelRatio()*(innerHeight/720);
    let flash = 0, flashAt = null, flashC = null;
    { const r7 = cast.rockets[7], f7 = FIRE[7];
      if (tau < GRAB){ r7.position.copy(r7.userData.homeW); r7.quaternion.copy(r7.userData.qW); r7.visible = true; }
      else if (tau < f7.tl){ const hand = cast.kid.userData.arms[0].userData.hand; hand.getWorldPosition(r7.position); hand.getWorldQuaternion(r7.quaternion).multiply(FLIP); r7.visible = true; fw.uR0.value[7].copy(r7.position); }
      else if (tau < f7.tl + FLY){ const u = (tau - f7.tl)/FLY; r7.position.copy(fw.uR0.value[7]).lerp(toWorld(f7.o), u*u); r7.quaternion.identity(); r7.visible = true; }
      else r7.visible = false; }
    FIRE.forEach((f, i) => { const rk = cast.rockets[i], tb = f.tl + FLY, o = toWorld(f.o);
      if (f.hand){ const a = tau - tb; if (a > 0 && a < 1.2){ const e = Math.exp(-a*3.2)*(f.v/42); if (e > flash){ flash = e; flashAt = o; flashC = f.c1; } } return; }
      if (tau < f.tl){ rk.visible = true; rk.position.copy(rk.userData.home); rk.quaternion.copy(rk.userData.q); }
      else if (tau < tb){ const u = (tau - f.tl)/FLY; rk.visible = true; const p = rk.userData.start.clone().lerp(o, u*u); rk.userData.world = p;
        cast.crate.worldToLocal(p); rk.position.copy(p); }
      else rk.visible = false;
      const a = tau - tb; if (a > 0 && a < 1.2){ const e = Math.exp(-a*3.2)*(f.v/42); if (e > flash){ flash = e; flashAt = o; flashC = f.c1; } } });
    if (flashAt){ world.flash.position.copy(flashAt); world.flash.color.set(flashC); world.flash.intensity = flash*2.6; } else world.flash.intensity = 0;
    postU.uFlash.value = flash*0.07; }
  // smoke from the stacks and chimneys, carried by the planner's wind
  { let n = 0;
    for (const e of world.emitters) for (let k = 0; k < 25; k++){ const slot = Math.floor(tSim/1.15) - k, birth = slot*1.15, age = tSim - birth;
      if (birth < 0 || age > 24 || puffHash(Math.floor(birth/18)*7 + e.index) > e.rate) continue;
      let dx = 0, dy = 0; for (let j = 0; j < 6; j++){ const w = A.wind(birth + age*(j + .5)/6); dx += w.x*age/6; dy += w.y*age/6; }
      const sp = puffs[n++]; if (!sp) break; const big = e.index < 3, size = (.75 + age*.28)*(big ? 1 : .6);
      sp.visible = true; sp.position.set(X(e.p[0] + dx), e.base + (e.p[2] + age*.7)*U, Z(e.p[1] + dy)); sp.scale.setScalar(size*2.6*U);
      sp.material.opacity = Math.min(1, age/1.7)*(1 - age/24)*(big ? .62 : .4)*(1 - night*0.7); sp.material.color.set(big ? '#c6c3b8' : '#e2ded3'); }
    for (; n < puffs.length; n++) puffs[n].visible = false; }
  if (frameNo % 3 === 0) world.turnSock(tSim);
  skyDome.position.copy(camera.position);
}

// the ending's sounds, and a few through the earlier scenes
function endingCues(){
  const S = window.SOUND, T = x => TOWN0 + x, C = [];
  C.push([T(END.door - 0.12), 'latch', 0.7], [T(END.door - 0.02), 'door-open', 0.8, 1.25], [T(END.door + 0.04), 'door-bang', 0.95], [T(35.72), 'click', 0.8], [T(36.05), () => S.squelch(0)], [T(36.95), () => S.squelch(0)]);
  for (const s of KID_ROUTE) if (s.k === 'run') for (let x = s.t0 + 0.05; x < s.t1; x += 0.19) C.push([T(x), 'step' + (Math.floor(x*37) % 5), 0.32, 1.2]);
  for (const s of GUARD_ROUTE) if (s.k === 'run' || s.k === 'walk') for (let x = s.t0 + 0.1; x < s.t1; x += s.k === 'run' ? 0.28 : 0.42) C.push([T(x), 'step' + (Math.floor(x*53) % 5), 0.5, 0.78]);
  C.push([T(37.15), 'cloth', 0.45], [T(37.6), 'land-soft', 0.6], [T(40.25), 'cloth', 0.5], [T(40.9), 'land-heavy', 0.75], [T(42.3), 'land-soft', 0.35]);
  for (let x = 42.7; x < END.jump; x += 0.78) C.push([T(x), () => { S.thump(0, 0.4); S.thump(0.17, 0.28); }]);        // his heart at the edge
  C.push([T(44.5), 'crackle', 0.16, 1.7], [T(44.95), 'ufo-zip', 0.45], [T(END.jump), 'cloth', 0.6]);
  C.push([T(END.crash), 'crash-metal', 0.95], [T(END.crash + 0.05), 'crash-tin', 0.85], [T(END.crash + 0.1), 'land-heavy', 0.9, 0.8], [T(END.crash + 0.14), 'crash-plank', 0.75],
    [T(END.crash + 0.4), 'crumble', 0.6], [T(END.crash + 0.62), 'crumble-glass', 0.35], [T(END.crash + 0.95), 'crash-tin', 0.3, 0.8]);
  for (const x of [9.6, 12.0, 14.3]) C.push([x + SPSH, () => S.burst(1.8, 0.1, 600, 0, 0.6)]);                        // swinging past the planets
  return C;
}
function finish(){
  if (done || !SITE) return; done = true;
  try { window.SOUND && window.SOUND.fadeOut && window.SOUND.fadeOut(); } catch (e){}
  if (EMBED && parent !== window) parent.postMessage({ type:'spirit-strikers-close' }, location.origin);   // replayed from the menu: close back to it
  else location.href = SITE.menu;
}
addEventListener('keydown', e => { if (e.key === 'Escape') finish(); });
// on the website: a quiet way past the intro (the menu's own frame has a back button, so not when replayed from there)
if (SITE && !EMBED){ const skip = document.createElement('a'); skip.href = SITE.menu; skip.textContent = 'Skip intro'; skip.className = 'skip-intro';
  skip.addEventListener('click', e => { e.preventDefault(); finish(); }); document.body.appendChild(skip); }
resize();
requestAnimationFrame(frame);

// build the town, the cast and space, then switch the set on
(async () => {
  try {
    await new Promise(r => setTimeout(r, 30));
    const portalLoad = PORTAL.load();                               // the footage and the drawings load while the town builds
    const built = buildTown(window.__TOWN);
    await new Promise(r => setTimeout(r, 0));
    FLIGHT = planFlight(); WAGON = planWagon();
    jet = makeJet(); scene.add(jet);
    // the cars on the planner's routes, rebuilt as 1980s models in the planner's paint
    const hex = c => '#' + new THREE.Color(c[0]/255, c[1]/255, c[2]/255).getHexString();
    built.cars.forEach(g => scene.remove(g));
    built.cars = built.traffic.poses().map(c => { const g = makeCar(c.type === 'pickup' ? 'pickup' : c.type === 'wagon' ? 'wagon' : 'sedan', c.paint ? hex(c.paint) : '#c9c2a2'); scene.add(g); return g; });
    const wagon = makeCar('wagon', '#8fb3c9'); scene.add(wagon);
    // the roof: the kid, the crate of rockets, the stair tower's door, and school security behind it
    const kid = makeRoofKid(), crate = makeCrate(), door = makeBulkhead(), guard = makeGuard(), onRoof = (o, p, h) => { o.position.set(X(p[0]), HEIGHT(p[0], p[1]) + ROOF.deck, Z(p[1])); o.rotation.y = -h; scene.add(o); };
    onRoof(kid, ROOF.kid, Math.PI/2); onRoof(crate, ROOF.crate, Math.PI/2 + 0.3); onRoof(door, ROOF.door, 0); scene.add(guard); guard.visible = false; SCHOOL_OBJS.push(door);
    crate.updateMatrixWorld(true);
    const rockets = crate.userData.rockets;
    rockets.forEach(rk => { rk.userData.home = rk.position.clone(); rk.userData.q = rk.quaternion.clone(); rk.userData.start = rk.getWorldPosition(new THREE.Vector3()); });
    { const r7 = rockets[7]; r7.userData.homeW = r7.userData.start.clone(); r7.userData.qW = r7.getWorldQuaternion(new THREE.Quaternion()); crate.remove(r7); scene.add(r7); }   // the last one leaves with him
    const ufo = makeUfo(), flashlight = makeFlashlight(), moon = new THREE.DirectionalLight(0xa9bcff, 0); scene.add(moon, moon.target);
    const fw = makeFireworks(); scene.add(fw);
    FIRE.forEach((f, i) => { const u = fw.material.uniforms; u.uO.value[i].copy(toWorld(f.o)); u.uB.value[i] = f.tl + FLY; u.uL.value[i] = f.tl; u.uV.value[i] = f.v;
      u.uC1.value[i].set(f.c1); u.uC2.value[i].set(f.c2); u.uR0.value[i].copy(rockets[i].userData.start); });
    const flash = new THREE.PointLight(0xffffff, 0, 400, 1.6); scene.add(flash);
    if (window.SOUND){ const ear = toWorld([464.6, 335.6, 8.6]), ear2 = toWorld([497.5, 335.8, 1.5]);
      window.SOUND.setFire(FIRE.map(f => ({ tl: TOWN0 + f.tl, fly: FLY, dist: toWorld(f.o).distanceTo(f.hand ? ear2 : ear), k: f.v/42, muffle: !!f.hand })));
      window.SOUND.setCues(endingCues()); }
    cast = { kid, crate, door, guard, rockets, wagon, ufo };
    for (let k = 0; k < built.emitters.length*25; k++){ const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map:puffTex, transparent:true, depthWrite:false, opacity:0 })); sp.visible = false; scene.add(sp); puffs.push(sp); }
